<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeting & Name Visualizer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 420px;
            width: 90%;
            transition: all 0.4s ease;
        }

        h1 {
            font-weight: 300;
            margin-bottom: 24px;
            letter-spacing: 1px;
            font-size: 28px;
        }

        .input-group {
            position: relative;
            margin-bottom: 24px;
        }

        input {
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 16px;
            outline: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 172, 254, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        #greeting-output {
            margin-top: 30px;
            font-size: 22px;
            font-weight: 300;
            min-height: 30px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #visual-canvas {
            margin-top: 20px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.2);
            box-shadow: 0 0 30px rgba(0,0,0,0.2), inset 0 0 20px rgba(255,255,255,0.05);
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: none; 
        }

        .visible {
            opacity: 1 !important;
            transform: scale(1) !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome</h1>
        <div class="input-group">
            <input type="text" id="name-input" placeholder="e.g., Yash" autocomplete="off" onkeypress="handleKeyPress(event)">
        </div>
        <button onclick="generateVisual()">Generate Identity</button>
        
        <div id="greeting-output"></div>
        <canvas id="visual-canvas" width="220" height="220"></canvas>
    </div>

    <script>
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                generateVisual();
            }
        }

        function generateVisual() {
            const nameInput = document.getElementById('name-input').value.trim();
            const greetingOutput = document.getElementById('greeting-output');
            const canvas = document.getElementById('visual-canvas');
            const ctx = canvas.getContext('2d');

            if (!nameInput) {
                greetingOutput.innerHTML = "Please enter your name!";
                greetingOutput.classList.add('visible');
                canvas.classList.remove('visible');
                setTimeout(() => canvas.style.display = 'none', 500);
                return;
            }

            greetingOutput.innerHTML = `Hello, <strong style="color: #4facfe;">${nameInput}</strong>!`;
            greetingOutput.classList.add('visible');
            canvas.style.display = 'inline-block';
            
            setTimeout(() => canvas.classList.add('visible'), 50);

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let seed = 0;
            for (let i = 0; i < nameInput.length; i++) {
                seed += nameInput.charCodeAt(i);
            }

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            const numShapes = (seed % 4) + 4; 
            
            for (let i = 0; i < numShapes; i++) {
                const charCode = nameInput.charCodeAt(i % nameInput.length);
                const radius = 30 + ((charCode * (i + 1)) % 45);
                const angle = ((i * 360) / numShapes) * (Math.PI / 180);
                
                const distance = ((seed * (i + 1)) % 35);
                
                const x = centerX + Math.cos(angle) * distance;
                const y = centerY + Math.sin(angle) * distance;

                const hue = (charCode * 7 + i * 45) % 360;
                
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                
                const gradient = ctx.createRadialGradient(x - radius/3, y - radius/3, radius/10, x, y, radius);
                gradient.addColorStop(0, `hsla(${hue}, 90%, 75%, 0.8)`);
                gradient.addColorStop(1, `hsla(${hue}, 80%, 55%, 0.2)`);
                
                ctx.fillStyle = gradient;
                ctx.fill();
                
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = `hsla(${hue}, 100%, 85%, 0.6)`;
                ctx.stroke();
            }

            const initial = nameInput.charAt(0).toUpperCase();
            
            ctx.shadowColor = "rgba(0,0,0,0.5)";
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 80px 'Segoe UI', sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(initial, centerX, centerY + 5); 
            
            ctx.shadowColor = "transparent";
        }
    </script>
</body>
</html>
