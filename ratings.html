<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dehradun Eats — Rate Your Experience</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #F5A623;
    --gold2: #FFD166;
    --accent: #E84393;
    --teal: #06D6A0;
    --glass-bg: rgba(20, 20, 25, 0.45);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-highlight: rgba(255, 255, 255, 0.15);
  }

  html { scroll-behavior: smooth; }

  body {
    background: #09050e;
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    cursor: none;
  }

  /* Hardware-accelerated custom cursor */
  #cursor {
    width: 18px; height: 18px;
    border: 2px solid var(--gold);
    border-radius: 50%;
    position: fixed; top: 0; left: 0;
    pointer-events: none; z-index: 9999;
    will-change: transform;
    transition: width 0.3s ease, height 0.3s ease, background 0.3s ease, border-color 0.3s ease;
    mix-blend-mode: difference;
  }
  #cursor.hovered {
    width: 48px; height: 48px;
    background: rgba(245,166,35,0.15);
    border-color: var(--gold2);
  }

  /* Animated background orbs */
  .bg-orbs {
    position: fixed; inset: 0;
    pointer-events: none; z-index: -1; overflow: hidden;
  }
  .orb {
    position: absolute; border-radius: 50%;
    filter: blur(100px); opacity: 0.3;
    animation: floatOrb 12s ease-in-out infinite alternate;
  }
  .orb1 { width: 450px; height: 450px; background: #5B21B6; top: -10%; left: -10%; }
  .orb2 { width: 350px; height: 350px; background: #E84393; top: 40%; right: -10%; animation-delay: -4s; }
  .orb3 { width: 300px; height: 300px; background: #06D6A0; bottom: -10%; left: 20%; animation-delay: -8s; opacity: 0.2;}

  @keyframes floatOrb {
    from { transform: translate(0,0) scale(1); }
    to   { transform: translate(60px, 40px) scale(1.1); }
  }

  /* Minimalist Grid Layout */
  .container {
    position: relative; z-index: 1;
    max-width: 820px; margin: 0 auto;
    padding: 60px 24px 100px;
  }

  /* Header */
  .header {
    text-align: center; margin-bottom: 64px;
    animation: fadeSlideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .header-tag {
    display: inline-block;
    font-size: 10px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase;
    color: var(--gold2);
    border: 1px solid rgba(245,166,35,0.2);
    border-radius: 30px; padding: 8px 24px; margin-bottom: 24px;
    background: rgba(245,166,35,0.05);
    backdrop-filter: blur(10px);
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 5vw, 4rem);
    font-weight: 900; line-height: 1.1;
    background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 50%, var(--gold) 100%);
    background-clip: text;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 16px;
  }

  .subtitle { font-size: 15px; color: #a09fa6; font-weight: 300; }

  /* Glassmorphic Restaurant Cards Grid */
  .restaurants-grid { display: grid; gap: 24px; perspective: 1000px; }

  .rest-card {
    background: var(--glass-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--glass-border);
    border-top: 1px solid var(--glass-highlight);
    border-left: 1px solid var(--glass-highlight);
    border-radius: 24px;
    padding: 28px 32px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.1s ease, box-shadow 0.4s ease, border-color 0.4s ease;
    animation: fadeSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .rest-card:hover {
    box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 40px rgba(245,166,35,0.05);
    border-color: rgba(245,166,35,0.2);
  }

  /* Depth elements for 3D effect */
  .rest-header, .star-row, .progress-bar, .feedback-area, .submit-btn {
    transform: translateZ(20px);
  }

  .rest-header { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 24px; }

  .rest-emoji {
    width: 60px; height: 60px; border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; flex-shrink: 0;
    box-shadow: inset 0 2px 10px rgba(255,255,255,0.1);
  }

  .rest-info { flex: 1; min-width: 0; }

  .rest-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem; font-weight: 700;
    margin-bottom: 8px; letter-spacing: 0.5px;
  }

  .rest-meta {
    font-size: 12px; color: #8a8991;
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
  }

  .cuisine-tag {
    font-size: 10px; padding: 4px 14px;
    border-radius: 20px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px;
    border: 1px solid rgba(255,255,255,0.05);
  }

  .reviews-count { margin-left: auto; font-weight: 500; }

  /* Interactive Stars */
  .star-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .stars { display: flex; gap: 8px; }

  .star {
    width: 36px; height: 36px; position: relative;
    transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
  }
  .star svg { width: 100%; height: 100%; display: block; pointer-events: none; }
  .star:hover { transform: scale(1.2) translateY(-2px); }
  .star.pop { animation: starPop 0.4s cubic-bezier(0.34,1.56,0.64,1); }

  @keyframes starPop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.5) rotate(15deg); }
    100% { transform: scale(1); }
  }

  .rating-label {
    font-size: 13px; font-weight: 500; color: #6a6971;
    transition: color 0.3s; min-width: 110px; margin-left: 10px;
  }

  /* Minimal Progress Bar */
  .progress-bar {
    height: 2px; background: rgba(255,255,255,0.05);
    border-radius: 2px; margin-bottom: 4px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%; border-radius: 2px;
    background: linear-gradient(90deg, var(--gold), var(--accent));
    transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Glassmorphic Input */
  .feedback-area {
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 16px; width: 100%; padding: 16px 20px;
    color: #fff; font-family: 'DM Sans', sans-serif;
    font-size: 14px; resize: none; height: 0;
    transition: height 0.4s ease, opacity 0.4s ease, border-color 0.3s;
    outline: none; opacity: 0; overflow: hidden; margin-top: 0;
  }
  .feedback-area.visible { height: 100px; opacity: 1; margin-top: 20px; }
  .feedback-area:focus {
    border-color: rgba(245,166,35,0.5);
    background: rgba(0,0,0,0.4);
  }

  /* Magnetic Submit Button */
  .submit-btn {
    margin-top: 16px; display: none; opacity: 0;
    padding: 12px 32px; border-radius: 30px;
    border: 1px solid rgba(255,255,255,0.1);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    background: linear-gradient(135deg, rgba(245,166,35,0.2), rgba(232,67,147,0.2));
    backdrop-filter: blur(10px); color: #fff;
    transition: opacity 0.3s, background 0.3s;
    overflow: hidden; position: relative;
  }
  .submit-btn.visible { display: inline-block; }
  .submit-btn:hover { background: linear-gradient(135deg, var(--gold), var(--accent)); border-color: transparent;}

  /* Success Overlay */
  .confirm-overlay {
    position: absolute; inset: 0; border-radius: 24px;
    background: rgba(9, 5, 14, 0.85); backdrop-filter: blur(12px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    opacity: 0; pointer-events: none; transition: opacity 0.5s ease; z-index: 10;
  }
  .confirm-overlay.show { opacity: 1; pointer-events: all; }

  .confirm-icon {
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(6, 214, 160, 0.15); border: 2px solid var(--teal);
    display: flex; align-items: center; justify-content: center; font-size: 28px;
    animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  .confirm-text {
    font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 700;
    color: var(--teal);
  }

  /* Summary Dashboard */
  .summary-panel {
    margin-top: 60px;
    background: var(--glass-bg); backdrop-filter: blur(24px);
    border: 1px solid var(--glass-border); border-top: 1px solid var(--glass-highlight);
    border-radius: 24px; padding: 40px;
    animation: fadeSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
  }

  .summary-title {
    font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700;
    margin-bottom: 32px; letter-spacing: 0.5px;
  }

  .summary-row { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
  .summary-name { font-size: 14px; font-weight: 500; width: 180px; }
  .bar-track { flex: 1; height: 6px; background: rgba(0,0,0,0.3); border-radius: 6px; }
  .bar-fill { height: 100%; border-radius: 6px; width: 0%; transition: width 1s cubic-bezier(0.16, 1, 0.3, 1); }
  .summary-score { font-size: 14px; font-weight: 700; min-width: 40px; text-align: right; }

  .city-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 40px; }
  .stat-card {
    background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05);
    border-radius: 16px; padding: 24px; text-align: center;
  }
  .stat-val { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 900; color: var(--gold2); }
  .stat-lbl { font-size: 10px; color: #8a8991; margin-top: 8px; letter-spacing: 1.5px; text-transform: uppercase; }

  /* Toast & Particles */
  .toast {
    position: fixed; bottom: 40px; left: 50%; transform: translate(-50%, 100px);
    background: rgba(255,255,255,0.1); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 40px;
    padding: 14px 32px; font-size: 14px; font-weight: 500; color: #fff; z-index: 9990;
    transition: transform 0.5s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s;
    opacity: 0; pointer-events: none;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }

  .particle { position: fixed; pointer-events: none; z-index: 9998; border-radius: 50%; animation: particleFly var(--dur) ease-out forwards; }
  
  @keyframes particleFly {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
  }
  @keyframes fadeSlideDown { from { opacity: 0; transform: translateY(-40px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #09050e; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

  @media (max-width: 768px) {
    .rest-card { padding: 24px 20px; }
    .city-stats { grid-template-columns: 1fr; }
    .summary-name { width: 120px; }
    #cursor { display: none; }
    body { cursor: auto; }
  }
</style>
</head>
<body>

<div id="cursor"></div>
<div class="bg-orbs">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>
<div class="toast" id="toast"></div>

<div class="container">
  <div class="header">
    <div class="header-tag">🍽️ Dehradun Eats</div>
    <h1>Rate Your Dining<br>Experience</h1>
    <p class="subtitle">Share your honest thoughts — help others discover the city's finest</p>
  </div>

  <div class="restaurants-grid" id="restaurantsGrid"></div>

  <div class="summary-panel" id="summaryPanel">
    <div class="summary-title">Live City Ratings</div>
    <div id="summaryRows"></div>
    <div class="city-stats" id="cityStats"></div>
  </div>
</div>

<script>
/* ===== Data & State ===== */
const restaurants = [
  { id:1, name:"Maplewood Bistro",   cuisine:"Continental", emoji:"🥩", color:"#E05C5C", bg:"rgba(224,92,92,0.1)",  barGrad:"linear-gradient(90deg,#C0392B,#E74C3C)" },
  { id:2, name:"Sakura Garden",      cuisine:"Japanese",    emoji:"🍣", color:"#E84393", bg:"rgba(232,67,147,0.1)", barGrad:"linear-gradient(90deg,#E84393,#FF6EB4)" },
  { id:3, name:"Spice Route",        cuisine:"Indian",      emoji:"🍛", color:"#F5A623", bg:"rgba(245,166,35,0.1)", barGrad:"linear-gradient(90deg,#F5A623,#FFD166)" },
  { id:4, name:"La Bella Vita",      cuisine:"Italian",     emoji:"🍕", color:"#06D6A0", bg:"rgba(6,214,160,0.1)",  barGrad:"linear-gradient(90deg,#06D6A0,#06A8D6)" },
  { id:5, name:"Dragon Palace",      cuisine:"Chinese",     emoji:"🥟", color:"#9B59B6", bg:"rgba(155,89,182,0.1)", barGrad:"linear-gradient(90deg,#9B59B6,#C39BD3)" }
];

const ratingLabels   = ["","Terrible 😤","Poor 😕","Average 🙂","Great 😋","Outstanding 🤩"];
const ratingColors   = ["","#E84393","#F5A623","#FFD166","#06D6A0","#06D6A0"];
const particleColors = ["#F5A623","#FFD166","#E84393","#06D6A0","#fff"];

const state = {};
restaurants.forEach(r => state[r.id] = { selected: 0, totalScore: 0, reviews: 0 });

/* ===== High-Performance Cursor ===== */
const cur = document.getElementById('cursor');
let mouseX = window.innerWidth/2, mouseY = window.innerHeight/2;
let curX = mouseX, curY = mouseY;

document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

function animateCursor() {
  curX += (mouseX - curX) * 0.2;
  curY += (mouseY - curY) * 0.2;
  cur.style.transform = `translate3d(${curX}px, ${curY}px, 0) translate(-50%, -50%)`;
  requestAnimationFrame(animateCursor);
}
animateCursor();

/* ===== Build UI ===== */
function init() {
  const grid = document.getElementById('restaurantsGrid');
  
  grid.innerHTML = restaurants.map((r, i) => `
    <div class="rest-card" id="card-${r.id}" style="animation-delay: ${i * 0.15}s">
      <div class="confirm-overlay" id="confirm-${r.id}">
        <div class="confirm-icon">✓</div>
        <div class="confirm-text">Thank you!</div>
      </div>

      <div class="rest-header">
        <div class="rest-emoji" style="background:${r.bg}; color:${r.color};" id="emoji-${r.id}">${r.emoji}</div>
        <div class="rest-info">
          <div class="rest-name">${r.name}</div>
          <div class="rest-meta">
            <span class="cuisine-tag" style="background:${r.bg};color:${r.color};">${r.cuisine}</span>
            <span class="reviews-count" id="rc-${r.id}">No reviews yet</span>
          </div>
        </div>
      </div>

      <div class="star-row">
        <div class="stars">
          ${[1,2,3,4,5].map(n => `
            <div class="star" data-rid="${r.id}" data-val="${n}" id="star-${r.id}-${n}">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" 
                  stroke="rgba(255,255,255,0.15)" stroke-width="1.5" fill="rgba(255,255,255,0.02)" 
                  class="star-path" id="sp-${r.id}-${n}" style="transition: fill 0.2s, stroke 0.2s;"/>
              </svg>
            </div>`).join('')}
        </div>
        <div class="rating-label" id="lbl-${r.id}">Tap to rate</div>
      </div>

      <div class="progress-bar"><div class="progress-fill" id="prog-${r.id}"></div></div>
      <textarea class="feedback-area" id="fb-${r.id}" placeholder="Details about your visit..."></textarea>
      <button class="submit-btn" data-rid="${r.id}" id="btn-${r.id}">Submit Feedback ✦</button>
    </div>
  `).join('');

  buildSummary();
  setupInteractions();
}

/* ===== Event Delegation & 3D Interactions ===== */
function setupInteractions() {
  const grid = document.getElementById('restaurantsGrid');

  // 3D Tilt Effect
  document.querySelectorAll('.rest-card').forEach(card => {
    card.addEventListener('mousemove', e => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const xPct = (x / rect.width - 0.5) * 2; 
      const yPct = (y / rect.height - 0.5) * -2;
      card.style.transform = `perspective(1000px) rotateX(${yPct * 4}deg) rotateY(${xPct * 4}deg) scale3d(1.02, 1.02, 1.02)`;
    });
    card.addEventListener('mouseleave', () => {
      card.style.transform = `perspective(1000px) rotateX(0) rotateY(0) scale3d(1, 1, 1)`;
    });
  });

  // Global Cursor Hover States
  document.body.addEventListener('mouseover', e => {
    if (e.target.closest('.star, .submit-btn, textarea')) cur.classList.add('hovered');
  });
  document.body.addEventListener('mouseout', e => {
    if (e.target.closest('.star, .submit-btn, textarea')) cur.classList.remove('hovered');
  });

  // Star Preview Logic
  grid.addEventListener('mouseover', e => {
    const star = e.target.closest('.star');
    if (star) {
      const rid = parseInt(star.dataset.rid), val = parseInt(star.dataset.val);
      updateStarsUI(rid, val, true);
    }
  });

  grid.addEventListener('mouseout', e => {
    const star = e.target.closest('.star');
    if (star) {
      const rid = parseInt(star.dataset.rid);
      updateStarsUI(rid, state[rid].selected, false);
    }
  });

  // Click Actions (Rate & Submit)
  grid.addEventListener('click', e => {
    const star = e.target.closest('.star');
    const btn = e.target.closest('.submit-btn');

    if (star) handleRate(parseInt(star.dataset.rid), parseInt(star.dataset.val), star);
    if (btn) handleSubmit(parseInt(btn.dataset.rid));
  });
}

function updateStarsUI(rid, val, isHover) {
  const sel = state[rid].selected;
  for (let n = 1; n <= 5; n++) {
    const p = document.getElementById(`sp-${rid}-${n}`);
    if (n <= val || (!isHover && n <= sel)) {
      p.style.fill = '#F5A623'; p.style.stroke = '#F5A623';
    } else {
      p.style.fill = 'rgba(255,255,255,0.02)'; p.style.stroke = 'rgba(255,255,255,0.15)';
    }
  }
}

function handleRate(rid, val, starEl) {
  state[rid].selected = val;
  updateStarsUI(rid, val, false);
  
  // Animate specific star
  starEl.classList.remove('pop');
  void starEl.offsetWidth; 
  starEl.classList.add('pop');

  const lbl = document.getElementById(`lbl-${rid}`);
  lbl.textContent = ratingLabels[val];
  lbl.style.color = ratingColors[val];
  document.getElementById(`prog-${rid}`).style.width = `${(val/5)*100}%`;

  const fb = document.getElementById(`fb-${rid}`);
  const btn = document.getElementById(`btn-${rid}`);
  fb.classList.add('visible');
  btn.classList.add('visible');
  setTimeout(() => btn.style.opacity = '1', 50);

  spawnParticles(starEl);
}

function handleSubmit(rid) {
  const s = state[rid];
  if (!s.selected) return;

  s.totalScore += s.selected;
  s.reviews++;

  const overlay = document.getElementById(`confirm-${rid}`);
  overlay.classList.add('show');
  spawnParticles(document.getElementById(`emoji-${rid}`), 25);
  
  const restName = restaurants.find(x => x.id === rid).name;
  showToast(`🌟 Rated ${restName} — ${ratingLabels[s.selected]}`);

  // Reset State after delay
  setTimeout(() => {
    overlay.classList.remove('show');
    s.selected = 0;
    updateStarsUI(rid, 0, false);
    document.getElementById(`lbl-${rid}`).textContent = 'Tap to rate';
    document.getElementById(`lbl-${rid}`).style.color = '#6a6971';
    document.getElementById(`prog-${rid}`).style.width = '0%';
    
    const fb = document.getElementById(`fb-${rid}`);
    const btn = document.getElementById(`btn-${rid}`);
    fb.classList.remove('visible'); fb.value = '';
    btn.classList.remove('visible'); btn.style.opacity = '0';
    
    const avg = (s.totalScore / s.reviews).toFixed(1);
    document.getElementById(`rc-${rid}`).textContent = `${s.reviews} review${s.reviews > 1 ? 's' : ''} · ★ ${avg}`;
    updateSummary();
  }, 2000);
}

/* ===== Utilities ===== */
function spawnParticles(el, count = 12) {
  const rect = el.getBoundingClientRect();
  const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
  
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 8 + 4;
    const ang = (Math.random() * 360) * Math.PI / 180;
    const dist = Math.random() * 80 + 40;
    const col = particleColors[Math.floor(Math.random() * particleColors.length)];
    
    p.style.cssText = `
      width:${size}px; height:${size}px; left:${cx}px; top:${cy}px; background:${col};
      --tx:${(Math.cos(ang)*dist).toFixed(0)}px; --ty:${(Math.sin(ang)*dist).toFixed(0)}px;
      --dur:${(Math.random() * 0.4 + 0.4).toFixed(2)}s;
    `;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1000);
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

/* ===== Dashboard ===== */
function buildSummary() {
  document.getElementById('summaryRows').innerHTML = restaurants.map(r => `
    <div class="summary-row">
      <div class="summary-name">${r.name}</div>
      <div class="bar-track"><div class="bar-fill" id="sbar-${r.id}" style="background:${r.barGrad};"></div></div>
      <div class="summary-score" id="sscore-${r.id}">—</div>
    </div>
  `).join('');

  document.getElementById('cityStats').innerHTML = `
    <div class="stat-card"><div class="stat-val" id="stat-reviews">0</div><div class="stat-lbl">Total Reviews</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-avg">—</div><div class="stat-lbl">City Average</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-top">—</div><div class="stat-lbl">Top Rated</div></div>
  `;
}

function updateSummary() {
  let totalReviews = 0, totalScore = 0, topR = null, topAvg = 0;

  restaurants.forEach(r => {
    const s = state[r.id];
    const avg = s.reviews ? s.totalScore / s.reviews : 0;

    document.getElementById(`sbar-${r.id}`).style.width = `${(avg/5)*100}%`;
    document.getElementById(`sscore-${r.id}`).textContent = s.reviews ? avg.toFixed(1) : '—';

    totalReviews += s.reviews;
    totalScore += s.totalScore;
    if (avg > topAvg && s.reviews > 0) { topAvg = avg; topR = r; }
  });

  document.getElementById('stat-reviews').textContent = totalReviews;
  document.getElementById('stat-avg').textContent = totalReviews ? (totalScore/totalReviews).toFixed(1) : '—';
  document.getElementById('stat-top').textContent = topR ? topR.name : '—';
}

init();
</script>
</body>
</html>
